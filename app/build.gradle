plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

// BY MILVX CODER
android {
    namespace 'com.blrp.game'
    compileSdk 37

    // версии сборки
    flavorDimensions 'version'
    productFlavors {
        ver_release {
            dimension "version"
            manifestPlaceholders = [appName:"BLIGAN ROLE PLAY"]
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }

            externalNativeBuild {
                cmake {
                    cppFlags '-fvisibility=hidden'
                }
            }
        }
        ver_test {
            dimension "version"
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [appName:"BLIGAN ROLE PLAY TEST"]

            firebaseCrashlytics {
                nativeSymbolUploadEnabled false
            }
        }
    }

    //java ver
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    //kt ver
    kotlinOptions {
        jvmTarget = "21"
    }

    //дефолт
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36

        applicationId "com.blrp.game"
        versionName "0.10.01"
        versionCode 1001

        multiDexEnabled = true

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    //clear/zamena packet
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    //нативный компилятор new ver
    ndkVersion '28.0.13004108'

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // версии сборки
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    // типо дохуя умный
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        prefab = true
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.bytedance.android:shadowhook:1.0.10' // не трогать нахуй, а то убью
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.rommansabbir:AnimationX:2.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.5'

    implementation 'com.google.android.material:material:1.14.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation "com.github.skydoves:progressview:1.1.3"
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.2.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.github.valkriaine:Bouncy:2.3'

    implementation 'com.tuyenmonkey:mkloader:1.4.0'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
    implementation "com.github.skydoves:colorpickerview:2.3.0"
}